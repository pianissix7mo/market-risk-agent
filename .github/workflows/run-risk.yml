name: Run market risk agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_risk.py | tee run_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: market-risk-output
          path: |
            run_output.txt
            output/latest_data.json
      - name: Commit latest output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest_data.json
          if git diff --cached --quiet; then
            echo "No output change"
          else
            git commit -m "Update latest risk output [skip ci]"
            git push
          fi
