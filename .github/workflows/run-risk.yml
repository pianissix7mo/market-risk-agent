name: Run market risk agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_risk.py | tee run_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: market-risk-output
          path: |
            run_output.txt
            output/latest_data.json
