name: Temporary Whisper Small Model

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build quantizer
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper.cpp/build --config Release -j 2
      - name: Download and quantize multilingual small model
        run: |
          bash whisper.cpp/models/download-ggml-model.sh small
          whisper.cpp/build/bin/quantize whisper.cpp/models/ggml-small.bin whisper.cpp/models/ggml-small-q5_0.bin q5_0
          mkdir -p bundle
          cp whisper.cpp/models/ggml-small-q5_0.bin bundle/
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-model
          path: bundle/*
          retention-days: 1
