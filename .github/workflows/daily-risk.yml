name: Daily Market Risk Short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 1-5"
      timezone: "America/Toronto"

permissions:
  contents: write

concurrency:
  group: daily-market-risk-short
  cancel-in-progress: false

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore installed Python packages
        id: python-packages-cache
        uses: actions/cache@v4
        with:
          path: .python-packages
          key: ${{ runner.os }}-cp312-market-risk-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: steps.python-packages-cache.outputs.cache-hit != 'true'
        run: python -m pip install --target .python-packages -r requirements.txt

      - name: Add cached Python packages to path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.python-packages" >> "$GITHUB_ENV"

      - name: Ensure system media tools
        shell: bash
        run: |
          packages=()
          command -v ffmpeg >/dev/null 2>&1 || packages+=(ffmpeg)
          if ! command -v fc-list >/dev/null 2>&1 || ! fc-list | grep -qi "Noto Sans CJK"; then
            packages+=(fonts-noto-cjk)
          fi
          if (( ${#packages[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          else
            echo "ffmpeg and Noto CJK fonts already available; skipping apt install."
          fi

      - name: Generate latest market-risk JSON
        run: python daily_risk.py

      - name: Validate JSON
        run: |
          python -m json.tool output/latest_data.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("output/latest_data.json").read_text(encoding="utf-8"))
          percentile_metrics = {
              "VIX": data["volatility"]["vix"],
              "VXN": data["volatility"]["vxn"],
              "Gold / Copper Ratio": data["macro"]["gold_copper_ratio"],
              "10Y Treasury Yield": data["macro"]["treasury_10y"],
          }
          for name, metric in percentile_metrics.items():
              present = [
                  key for key in ("percentile_1y", "percentile_3y", "percentile_5y")
                  if key in metric
              ]
              if present and len(present) != 3:
                  raise AssertionError(f"{name} has incomplete percentile fields: {present}")

          quality = data.get("quality_gate") or {}
          assert quality.get("status") == "pass", quality
          assert int(quality.get("available_count", 0)) >= int(quality.get("minimum_required", 999)), quality
          assert data["valuation"]["nasdaq100"].get("forward_pe") is not None
          assert data["valuation"]["nasdaq100"].get("forward_pe_coverage") is not None
          print("Validated JSON, percentile consistency, and publication quality gate.")
          PY

      - name: Confirm fixed music exists
        run: |
          test -f assets/audio/a_night_alone_16s.mp3
          duration=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            assets/audio/a_night_alone_16s.mp3)
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          assert 15.8 <= duration <= 16.2, duration
          print(f"Fixed music duration: {duration:.3f}s")
          PY

      - name: Generate four cards and 16-second Short
        run: |
          rm -rf output/media
          mkdir -p output/media
          python generate_daily_short.py \
            --input output/latest_data.json \
            --output-dir output/media

      - name: Generate YouTube title and description
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("output/latest_data.json").read_text(encoding="utf-8"))
          signal = data["overall_signal"]
          market_date = str(data["market_date"])
          result = str(signal["result"])
          buy = int(signal.get("buy_count", 0))
          neutral = int(signal.get("neutral_count", 0))
          sell = int(signal.get("sell_count", 0))

          title = f"美股风险信号：{result}｜{market_date} #Shorts"
          description = (
              f"Market Risk Agent | {market_date}\n"
              f"结论：{result}\n"
              f"{buy}偏买 / {neutral}中立 / {sell}偏卖\n\n"
              f"#美股 #NASDAQ #SP500 #VIX #MarketRisk #{result}\n"
          )

          output = Path("output/media/title_description.txt")
          output.write_text(
              f"TITLE\n{title}\n\nDESCRIPTION\n{description}",
              encoding="utf-8",
          )
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = [
              "01_volatility.png",
              "02_sentiment.png",
              "03_macro.png",
              "04_summary.png",
          ]
          cards = sorted(Path("output/media").glob("*.png"))
          assert [card.name for card in cards] == expected, cards
          for card in cards:
              with Image.open(card) as image:
                  assert image.size == (1080, 1920), (card, image.size)
                  assert image.mode == "RGB", (card, image.mode)
          metadata = Path("output/media/title_description.txt")
          assert metadata.is_file() and metadata.stat().st_size > 0, metadata
          print("Validated four 1080x1920 RGB cards and YouTube metadata.")
          PY

      - name: Validate final mobile-compatible MP4
        run: |
          video=$(find output/media -maxdepth 1 \
            -name 'Market Risk Monitor *.mp4' \
            -print -quit)
          test -n "$video"
          test -s "$video"

          python - "$video" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", str(path),
          ], text=True))
          video = [s for s in probe["streams"] if s.get("codec_type") == "video"]
          audio = [s for s in probe["streams"] if s.get("codec_type") == "audio"]
          assert len(video) == 1, video
          assert len(audio) == 1, audio
          video = video[0]
          audio = audio[0]
          duration = float(probe["format"]["duration"])
          profile = str(video.get("profile", "")).lower()

          assert 15.8 <= duration <= 16.2, duration
          assert int(video["width"]) == 1080, video["width"]
          assert int(video["height"]) == 1920, video["height"]
          assert video["codec_name"].lower() == "h264", video["codec_name"]
          assert profile in {"baseline", "constrained baseline"}, profile
          assert video["pix_fmt"].lower() == "yuv420p", video["pix_fmt"]
          assert audio["codec_name"].lower() == "aac", audio["codec_name"]

          payload = path.read_bytes()
          moov = payload.find(b"moov")
          mdat = payload.find(b"mdat")
          assert 0 <= moov < mdat, (moov, mdat)
          print(
              f"Validated MP4: 1080x1920, {duration:.3f}s, "
              f"h264/{profile}, yuv420p, AAC, faststart"
          )
          PY

      - name: Upload latest media artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-risk-media-${{ github.run_number }}
          path: |
            output/latest_data.json
            output/media/*.png
            output/media/*.mp4
            output/media/title_description.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: unlisted
          YOUTUBE_CHANNEL_KEY: finance
          UPLOAD_STATE_BRANCH: upload-state
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python youtube_upload.py

      - name: Publish latest media to latest-media branch
        run: |
          media_tmp=$(mktemp -d)
          cp output/latest_data.json "$media_tmp/latest_data.json"
          cp output/upload_receipt.json "$media_tmp/upload_receipt.json"
          cp -R output/media "$media_tmp/media"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fdx
          git switch --orphan latest-media
          git rm -rf --ignore-unmatch .
          cp -R "$media_tmp"/* .

          cat > README.md <<'EOF'
          # Latest Market Risk Media

          This branch is automatically replaced after every successful weekday run.

          Files:

          - `latest_data.json`
          - `upload_receipt.json`
          - `media/01_volatility.png`
          - `media/02_sentiment.png`
          - `media/03_macro.png`
          - `media/04_summary.png`
          - `media/title_description.txt`
          - `media/Market Risk Monitor YYYY-MM-DD.mp4`
          EOF

          git add README.md latest_data.json upload_receipt.json media
          git commit -m "Publish latest 16-second Market Risk Monitor"
          git push --force origin HEAD:latest-media
