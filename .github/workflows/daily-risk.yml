name: Daily Market Risk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - daily_risk.py
      - generate_media.py
      - generate_media_audio.py
      - assets/audio/**
      - requirements.txt
      - .github/workflows/daily-risk.yml
  schedule:
    # 22:15 UTC = 18:15 Toronto during daylight time / 17:15 during standard time.
    # This is safely after the regular US market close year-round.
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-market-risk
  cancel-in-progress: false

jobs:
  run-daily-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate latest market-risk JSON
        run: python daily_risk.py

      - name: Validate JSON
        run: python -m json.tool output/latest_data.json > /dev/null

      - name: Generate four cards and 15-second Short with music
        run: python generate_media_audio.py --input output/latest_data.json --output-dir output/media

      - name: Validate generated media and audio
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          cards = sorted(Path("output/media").glob("*.png"))
          assert len(cards) == 4, f"Expected 4 cards, got {len(cards)}"
          for card in cards:
              with Image.open(card) as image:
                  assert image.size == (1080, 1920), f"Unexpected size for {card}: {image.size}"
          video = Path("output/media/market_risk_short.mp4")
          assert video.exists() and video.stat().st_size > 100_000, "Short video missing or too small"
          print("Validated four 1080x1920 cards and the Short video.")
          PY

          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/media/market_risk_short.mp4)
          audio_codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 output/media/market_risk_short.mp4)
          python - "$duration" "$audio_codec" <<'PY'
          import sys

          duration = float(sys.argv[1])
          audio_codec = sys.argv[2].strip()
          assert 14.5 <= duration <= 15.5, f"Unexpected video duration: {duration}"
          assert audio_codec, "Generated Short does not contain an audio stream"
          print(f"Video duration: {duration:.2f}s; audio codec: {audio_codec}")
          PY

      - name: Upload JSON, cards and Short artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-risk-media-${{ github.run_number }}
          path: |
            output/latest_data.json
            output/media/*.png
            output/media/market_risk_short.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated JSON to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest_data.json
          if git diff --cached --quiet; then
            echo "No JSON change to commit."
          else
            git commit -m "Update daily market risk data"
            git push origin HEAD:main
          fi

      - name: Publish only the latest media to latest-media branch
        run: |
          media_tmp=$(mktemp -d)
          cp output/latest_data.json "$media_tmp/latest_data.json"
          cp -R output/media "$media_tmp/media"

          git clean -fdx
          git switch --orphan latest-media
          git rm -rf . || true
          cp -R "$media_tmp"/* .

          cat > README.md <<'EOF'
          # Latest Market Risk Media

          This branch is automatically replaced on every successful run and contains only the latest files:

          - `latest_data.json`
          - `media/01_volatility.png`
          - `media/02_sentiment.png`
          - `media/03_macro.png`
          - `media/04_summary.png`
          - `media/market_risk_short.mp4`
          EOF

          git add README.md latest_data.json media
          git commit -m "Publish latest market risk media with music"
          git push --force origin HEAD:latest-media
