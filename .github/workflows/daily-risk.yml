name: Daily Market Risk

on:
  workflow_dispatch:
  schedule:
    # 22:15 UTC = 18:15 Toronto during daylight time / 17:15 during standard time.
    # This is safely after the regular US market close year-round.
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-market-risk
  cancel-in-progress: false

jobs:
  run-daily-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate latest market-risk JSON
        run: python daily_risk.py

      - name: Validate JSON
        run: python -m json.tool output/latest_data.json > /dev/null

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-market-risk-json
          path: output/latest_data.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest_data.json
          if git diff --cached --quiet; then
            echo "No data change to commit."
          else
            git commit -m "Update daily market risk data"
            git push origin HEAD:main
          fi
