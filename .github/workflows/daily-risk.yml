name: Daily Market Risk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - daily_risk.py
      - generate_media.py
      - generate_daily_short.py
      - assets/audio/a_night_alone_16s.mp3
      - requirements.txt
      - .github/workflows/daily-risk.yml
  schedule:
    # 22:15 UTC = 18:15 Toronto during daylight time.
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-market-risk
  cancel-in-progress: true

jobs:
  run-daily-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate latest market-risk JSON
        if: github.event_name != 'push'
        run: python daily_risk.py

      - name: Validate JSON
        run: python -m json.tool output/latest_data.json > /dev/null

      - name: Confirm fixed music exists
        run: |
          test -f assets/audio/a_night_alone_16s.mp3
          duration=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 \
            assets/audio/a_night_alone_16s.mp3)
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          assert 15.8 <= duration <= 16.2, duration
          print(f"Fixed music duration: {duration:.2f}s")
          PY

      - name: Generate four cards and 16-second Short
        run: |
          mkdir -p output/media
          python generate_daily_short.py \
            --input output/latest_data.json \
            --output-dir output/media

      - name: Validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          cards = sorted(Path("output/media").glob("*.png"))
          assert len(cards) == 4, f"Expected 4 cards, got {len(cards)}"

          expected = {
              "01_volatility.png",
              "02_sentiment.png",
              "03_macro.png",
              "04_summary.png",
          }
          assert {card.name for card in cards} == expected

          for card in cards:
              with Image.open(card) as image:
                  assert image.size == (1080, 1920), (
                      f"Unexpected size for {card}: {image.size}"
                  )

          print("Validated four 1080x1920 cards.")
          PY

      - name: Validate final mobile-compatible MP4
        run: |
          video=$(find output/media -maxdepth 1 \
            -name 'Market Risk Monitor *.mp4' \
            -print -quit)

          test -n "$video"
          test -s "$video"

          duration=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=nw=1:nk=1 "$video")

          width=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width \
            -of default=nw=1:nk=1 "$video")

          height=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=height \
            -of default=nw=1:nk=1 "$video")

          video_codec=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name \
            -of default=nw=1:nk=1 "$video")

          profile=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=profile \
            -of default=nw=1:nk=1 "$video")

          pix_fmt=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=pix_fmt \
            -of default=nw=1:nk=1 "$video")

          audio_codec=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=nw=1:nk=1 "$video")

          python - \
            "$duration" \
            "$width" \
            "$height" \
            "$video_codec" \
            "$profile" \
            "$pix_fmt" \
            "$audio_codec" <<'PY'
          import sys

          duration = float(sys.argv[1])
          width = int(sys.argv[2])
          height = int(sys.argv[3])
          video_codec = sys.argv[4].strip().lower()
          profile = sys.argv[5].strip().lower()
          pix_fmt = sys.argv[6].strip().lower()
          audio_codec = sys.argv[7].strip().lower()

          assert 15.8 <= duration <= 16.2, duration
          assert width == 1080, width
          assert height == 1920, height
          assert video_codec == "h264", video_codec
          assert profile in {"baseline", "constrained baseline"}, profile
          assert pix_fmt == "yuv420p", pix_fmt
          assert audio_codec == "aac", audio_codec

          print(
              f"Validated MP4: {width}x{height}, "
              f"{duration:.2f}s, {video_codec}/{profile}, "
              f"{pix_fmt}, audio={audio_codec}"
          )
          PY

      - name: Upload latest media artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-risk-media-${{ github.run_number }}
          path: |
            output/latest_data.json
            output/media/*.png
            output/media/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated JSON to main
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/latest_data.json

          if git diff --cached --quiet; then
            echo "No JSON change to commit."
          else
            git commit -m "Update daily market risk data"
            git push origin HEAD:main
          fi

      - name: Publish only the latest media to latest-media branch
        run: |
          media_tmp=$(mktemp -d)
          cp output/latest_data.json "$media_tmp/latest_data.json"
          cp -R output/media "$media_tmp/media"

          git clean -fdx
          git switch --orphan latest-media
          git rm -rf . || true
          cp -R "$media_tmp"/* .

          cat > README.md <<'EOF'
          # Latest Market Risk Media

          This branch is automatically replaced on every successful run.

          Files:

          - `latest_data.json`
          - `media/01_volatility.png`
          - `media/02_sentiment.png`
          - `media/03_macro.png`
          - `media/04_summary.png`
          - `media/Market Risk Monitor YYYY-MM-DD.mp4`
          EOF

          git add README.md latest_data.json media
          git commit -m "Publish latest 16-second Market Risk Monitor"
          git push --force origin HEAD:latest-media
