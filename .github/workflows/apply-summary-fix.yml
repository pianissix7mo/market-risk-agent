name: Apply Summary Page Fix

on:
  pull_request:
    paths:
      - .github/workflows/apply-summary-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply requested layout changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("generate_media.py")
          source = path.read_text(encoding="utf-8")

          old_pct = '''def pct(value: Any) -> str:\n    try:\n        return f"P{int(round(float(value)))}"\n    except (TypeError, ValueError):\n        return "P--"\n'''
          new_pct = '''def pct(value: Any) -> str:\n    try:\n        numeric = float(value)\n        # Keep normal percentile labels compact, but retain one decimal at\n        # extreme tails so P1.19 is not misleadingly flattened to P1.\n        return f"P{numeric:.1f}" if numeric < 5 or numeric > 95 else f"P{int(round(numeric))}"\n    except (TypeError, ValueError):\n        return "P--"\n'''
          if old_pct not in source:
              raise SystemExit("Could not locate pct formatter")
          source = source.replace(old_pct, new_pct, 1)

          start_marker = '    card(im, (L, 1086, R, 1588), "#10263C")\n'
          end_marker = '    footer(im, v)\n'
          start = source.index(start_marker, source.index("def render_summary"))
          end = source.index(end_marker, start)
          promo = '''    card(im, (L, 1086, R, 1738), "#10263C")\n    text(d, v, "video-kicker", (L + 42, 1124, R - 42, 1170), "想知道这些指标怎么解读？", 31, minimum=24, bold=True, fill=COL["blue"], align="center", max_lines=1)\n    text(d, v, "video-title", (L + 54, 1212, R - 54, 1372), "完整逻辑与使用方法\\n请看我的解释视频", 54, minimum=38, bold=True, align="center", valign="middle", gap=14, max_lines=2)\n    card(im, (L + 92, 1422, R - 92, 1510), COL["chip"], "#315777", 18)\n    text(d, v, "video-cta", (L + 116, 1440, R - 116, 1492), "Market Risk Monitor 指标解析", 30, minimum=23, bold=True, fill=COL["blue"], align="center", valign="middle", max_lines=1)\n    text(d, v, "video-topics", (L + 70, 1560, R - 70, 1610), "VIX · VXN · 市场情绪 · 宏观压力 · QQQ估值", 25, minimum=19, fill=COL["muted"], align="center", max_lines=1)\n    text(d, v, "video-note", (L + 70, 1640, R - 70, 1692), "频道内搜索上方标题即可观看", 24, minimum=18, fill=COL["dim"], align="center", max_lines=1)\n'''
          source = source[:start] + promo + source[end:]
          path.write_text(source, encoding="utf-8")
          PY

          rm -f .github/workflows/diagnose-gold-copper.yml
          rm -f .github/workflows/apply-summary-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate_media.py .github/workflows
          git commit -m "Clarify extreme percentile and promote explanation video"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
